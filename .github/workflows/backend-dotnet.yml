name: .NET 8 Backend CI/CD

on:
  push:
    branches: [ "main", "master", "develop", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dotnet.yml"
  pull_request:
    branches: [ "main", "master", "develop", "dev" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dotnet.yml"
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WORKING_DIRECTORY: "./backend"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Test
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore TarlaAsistani.slnx

      - name: Build Solution
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build TarlaAsistani.slnx --no-restore --configuration Release

      - name: Run All Tests (Unit & Integration)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          dotnet test TarlaAsistani.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIRECTORY }}/TestResults
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2: Docker Build & Verification
  # ─────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Build & Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: false
          tags: tarla-asistani-api:latest
