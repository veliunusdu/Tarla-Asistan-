name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: pytest tests -q
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters
          OTP_HASH_SECRET: ci-otp-secret-that-is-at-least-32-characters
          OTP_EXPOSE_IN_RESPONSE: "true"
          AGRONOMIST_PHONE_NUMBERS: "+905551112233"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build backend web
