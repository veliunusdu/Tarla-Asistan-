name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore TarlaAsistani.slnx

      - run: dotnet build TarlaAsistani.slnx --no-restore --configuration Release

      - run: dotnet test TarlaAsistani.slnx --no-build --configuration Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Restore google-services.json
        working-directory: mobile
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || {
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is missing"
            exit 1
          }

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile

      - name: Flutter test
        run: flutter test
        working-directory: mobile

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1
        working-directory: mobile

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]

    steps:
      - uses: actions/checkout@v4

      - run: docker compose config --quiet

      - run: docker compose build backend web
