name: tarla-asistani

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarla_asistani}
      POSTGRES_USER: ${POSTGRES_USER:-tarla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarla-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarla} -d ${POSTGRES_DB:-tarla_asistani}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-tarla_asistani};Username=${POSTGRES_USER:-tarla};Password=${POSTGRES_PASSWORD:-tarla-local}
      Auth__JwtSecret: ${JWT_SECRET:-local-only-jwt-secret-change-before-deploy-at-least-32-chars-long!}
      Auth__AccessTokenExpiryMinutes: 60
      Auth__RefreshTokenExpiryDays: 30
      Auth__OtpCooldownSeconds: 60
      Auth__OtpTtlSeconds: 180
      AGRONOMIST_PHONE_NUMBERS: ${AGRONOMIST_PHONE_NUMBERS:-+905551112233}
      Media__Provider: ${MEDIA_STORAGE_PROVIDER:-local}
      Media__StoragePath: /app/uploads
      Media__MaxUploadMb: ${MEDIA_MAX_UPLOAD_MB:-15}
      Weather__OpenMeteoBaseUrl: https://api.open-meteo.com/v1/forecast
      Weather__StaleAfterHours: 3
      AI__Provider: ${AI_CHAT_PROVIDER:-local}
      AI__DeepSeekApiKey: ${DEEPSEEK_API_KEY:-}
      AI__DeepSeekBaseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI__DeepSeekModel: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      Firebase__CredentialsPath: /run/secrets/firebase-service-account.json
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
    volumes:
      - media_data:/app/uploads
      - ./backend-dotnet/Secrets:/run/secrets:ro
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
