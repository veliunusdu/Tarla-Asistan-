name: tarla-asistani-staging

services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      OTP_EXPOSE_IN_RESPONSE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      FIREBASE_AUTH_ENABLED: ${FIREBASE_AUTH_ENABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/run/secrets/firebase-service-account.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      PUSH_GATEWAY_URL: ${PUSH_GATEWAY_URL:-}
      PUSH_GATEWAY_TOKEN: ${PUSH_GATEWAY_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}

  web:
    restart: unless-stopped
