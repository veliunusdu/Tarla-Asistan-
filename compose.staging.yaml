name: tarla-asistani-staging

services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Auth__JwtSecret: ${JWT_SECRET:?JWT_SECRET is required}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      Media__Provider: ${MEDIA_STORAGE_PROVIDER:?MEDIA_STORAGE_PROVIDER is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      AI__Provider: ${AI_CHAT_PROVIDER:-local}
      AI__DeepSeekApiKey: ${DEEPSEEK_API_KEY:-}
      AI__DeepSeekBaseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI__DeepSeekModel: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      Firebase__CredentialsPath: /run/secrets/firebase-service-account.json
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      Firebase__AuthEnabled: ${FIREBASE_AUTH_ENABLED:?FIREBASE_AUTH_ENABLED is required}

  web:
    restart: unless-stopped
